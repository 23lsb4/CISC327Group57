{% extends "base.html" %}
{% block content %}
<h1>Suppliers</h1>
<table>
  <tr>
    <th>ID</th><th>Name</th><th>Contact Email</th><th></th>
  </tr>
  {% for supplier in suppliers %}
  <tr>
    <td>{{ supplier.id }}</td>
    <td>{{ supplier.name }}</td>
    <td>{{ supplier.contact_email }}</td>
    <td>
      <form class="delete-form" method="post" action="{{ url_for('views.delete_supplier_page', supplier_id=supplier.id) }}">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<h2>Add a Supplier</h2>
<form method="post" action="{{ url_for('views.suppliers_page') }}">
  <label>Name <input type="text" name="name" required></label>
  <label>Contact Email <input type="email" name="contact_email" required></label>
  <button type="submit">Add Supplier</button>
</form>
{% endblock %}
