{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<table>
  <tr>
    <th>ID</th><th>Name</th><th>SKU</th><th>Unit Price</th><th>Qty on Hand</th><th></th>
  </tr>
  {% for product in products %}
  <tr>
    <td>{{ product.id }}</td>
    <td>{{ product.name }}</td>
    <td>{{ product.sku }}</td>
    <td>{{ product.unit_price }}</td>
    <td>{{ product.quantity_on_hand }}</td>
    <td>
      <form class="delete-form" method="post" action="{{ url_for('views.delete_product_page', product_id=product.id) }}">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<h2>Add a Product</h2>
<form method="post" action="{{ url_for('views.products_page') }}">
  <label>Name <input type="text" name="name" required></label>
  <label>SKU <input type="text" name="sku" required></label>
  <label>Unit Price <input type="number" step="0.01" name="unit_price" value="0" required></label>
  <label>Quantity on Hand <input type="number" name="quantity_on_hand" value="0" required></label>
  <button type="submit">Add Product</button>
</form>
{% endblock %}
