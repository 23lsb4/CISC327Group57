{% extends "base.html" %}
{% block content %}
<h1>Renters</h1>
<table>
  <tr>
    <th>ID</th><th>Name</th><th>Email</th><th>Membership Date</th><th></th>
  </tr>
  {% for renter in renters %}
  <tr>
    <td>{{ renter.id }}</td>
    <td>{{ renter.name }}</td>
    <td>{{ renter.email }}</td>
    <td>{{ renter.membership_date }}</td>
    <td>
      <form class="delete-form" method="post" action="{{ url_for('views.delete_renter_page', renter_id=renter.id) }}">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>

<h2>Add a Renter</h2>
<form method="post" action="{{ url_for('views.renters_page') }}">
  <label>Name <input type="text" name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <button type="submit">Add Renter</button>
</form>
{% endblock %}
